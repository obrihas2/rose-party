name: Sync upstream

# Keeps this fork current with Alban1911/Rose: merges upstream/main into
# party-mode-hardcoded, keeps our version of the Party Mode files whenever
# upstream collides with them, takes everything else literally, runs the same
# checks as CI, then fast-forwards main. A conflict outside the Party Mode
# list, a lost invariant or a failed check opens an issue instead of pushing.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  sync:
    name: Merge Alban1911/Rose and test
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Alban1911/Rose.git
          git fetch upstream main

      - name: Check for new upstream commits
        id: upstream
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already current with upstream/main."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse --short upstream/main)" >> "$GITHUB_OUTPUT"
            git log --oneline HEAD..upstream/main | head -20
          fi

      - name: Merge upstream
        if: steps.upstream.outputs.new == 'true'
        id: merge
        run: |
          if git merge --no-edit upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflict-files.txt
            echo "::error::Merge conflict with upstream/main"
            cat conflict-files.txt
          fi

      - name: Keep our Party Mode files on conflict
        if: steps.upstream.outputs.new == 'true'
        id: keep
        run: |
          # Party Mode lives in files this fork owns. When upstream edits the
          # same lines, keep our version automatically instead of blocking the
          # sync; every other conflict still stops the run for a human.
          party_files=(
            "party/core/party_storage.py"
            "party/core/party_manager.py"
            "party/tests/test_party.py"
            "pengu/communication/message_handler.py"
            "main/__init__.py"
            "launcher/update/github_client.py"
            "party/network/relay_config.py"
            "Pengu Loader/plugins/ROSE-PartyMode/index.js"
          )
          kept=()
          while IFS= read -r -d '' f; do
            for p in "${party_files[@]}"; do
              if [ "$f" = "$p" ]; then
                if git checkout --ours -- "$f" && git add "$f"; then
                  kept+=("$f")
                fi
                break
              fi
            done
          done < <(git diff --name-only -z --diff-filter=U)
          remaining=$(git diff --name-only --diff-filter=U | wc -l)
          if [ "$remaining" -eq 0 ]; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U > conflict-files.txt
            echo "::error::$remaining merge conflict(s) outside the Party Mode file list"
            cat conflict-files.txt
          fi
          if [ ${#kept[@]} -gt 0 ]; then
            {
              echo "### Sync kept our Party Mode version"
              echo
              printf -- "- \`%s\`\n" "${kept[@]}"
              echo
              echo "Upstream's edits to these files were skipped this run."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Kept ours for: ${kept[*]}"
          fi

      - name: Report merge conflict
        if: steps.merge.outputs.conflict == 'true' && steps.keep.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          body="Upstream Alban1911/Rose at ${UPSTREAM_SHA} no longer merges cleanly into party-mode-hardcoded.

          Conflicting files:

          \`\`\`
          $(cat conflict-files.txt)
          \`\`\`

          Resolve the merge locally (keep the shared room key, the auto-enable supervisor, the tracked relay config and the obrihas2/rose-party release URLs), run the tests, and push. The sync will resume automatically once this is closed."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Upstream sync blocked by merge conflicts" in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync blocked by merge conflicts" --body "$body"
          fi
          exit 1

      - name: Guard Party Mode invariants
        if: steps.keep.outputs.clean == 'true' && steps.upstream.outputs.new == 'true'
        id: guard
        run: |
          failed=""
          grep -q 'SHARED_ROOM_KEY = "[0-9a-f]\{32\}"' party/core/party_storage.py || failed="$failed shared-room-key"
          grep -q 'load_shared_room_key()' party/core/party_manager.py || failed="$failed shared-room-join"
          grep -q 'auto_enable_party' pengu/communication/message_handler.py || failed="$failed auto-enable-supervisor"
          grep -q 'auto_enable_party' main/__init__.py || failed="$failed startup-call"
          grep -q 'obrihas2/rose-party' launcher/update/github_client.py || failed="$failed release-urls"
          grep -q 'rose-party-relay' party/network/relay_config.py || failed="$failed relay-url"
          if [ -n "$failed" ]; then
            echo "broken=$failed" >> "$GITHUB_OUTPUT"
            echo "::error::Party Mode invariants lost after merge:$failed"
            exit 1
          fi
          echo "broken=" >> "$GITHUB_OUTPUT"

      - name: Report broken invariants
        if: failure() && steps.guard.outputs.broken != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          body="Merging upstream Alban1911/Rose at ${UPSTREAM_SHA} broke these Party Mode invariants:${steps.guard.outputs.broken}

          Restore them (shared room key, auto-enable supervisor, tracked relay config, obrihas2/rose-party release URLs) and push. Nothing was pushed by the sync."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Upstream sync broke Party Mode invariants" in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync broke Party Mode invariants" --body "$body"
          fi
          exit 1

      - name: Install test dependencies
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        run: python -m pip install -r requirements.txt ruff==0.16.8

      - name: Lint (syntax errors and undefined names only)
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        run: python -m ruff check . --select E9,F63,F7,F82

      - name: Unit tests (test/ and every package's tests/)
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        run: |
          suites=("test")
          for dir in */; do
            dir="${dir%/}"
            if [ -d "$dir/tests" ]; then suites+=("$dir/tests"); fi
          done
          failed=()
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            python -m unittest discover -s "$suite" -t . || failed+=("$suite")
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::Failing suites: ${failed[*]}"
            exit 1
          fi

      - name: JavaScript checks
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        run: |
          git ls-files -z 'Pengu Loader/plugins/*.js' | xargs -0 -n1 node --check
          while IFS= read -r t; do
            node --test "$t"
          done < <(grep -o 'node --test [^ ]*' .github/workflows/ci.yml | awk '{print $3}' | sort -u)

      - name: Report failed checks
        if: failure() && steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true' && steps.guard.outputs.broken == ''
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          body="Upstream Alban1911/Rose at ${UPSTREAM_SHA} merged cleanly (Party Mode files kept our version where they collided), but the end-of-sync checks failed. Nothing was pushed.

          The run log names the failing step. Fix it locally and push, then close this issue — the next scheduled sync retries."
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"Upstream sync failed its checks" in:title' \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Upstream sync failed its checks" --body "$body"
          fi
          exit 1

      - name: Push merged branch and fast-forward main
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/party-mode-hardcoded HEAD:refs/heads/main
          echo "Pushed $(git rev-parse --short HEAD) to party-mode-hardcoded and main."

      # A push made with GITHUB_TOKEN does not trigger on: push workflows,
      # so the release this merge deserves has to be requested explicitly
      # (workflow_dispatch is exempt from that suppression).
      - name: Dispatch the release build
        if: steps.upstream.outputs.new == 'true' && steps.keep.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY"
